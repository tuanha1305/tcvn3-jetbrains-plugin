name: Build, test, release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach .zip to release on tag push
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Generate Gradle wrapper
        run: gradle wrapper

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Verify plugin
        run: ./gradlew verifyPluginProjectConfiguration --no-daemon

      - name: Build plugin .zip
        run: ./gradlew buildPlugin --no-daemon

      - name: Show artifact
        run: ls -la build/distributions/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcvn3-jetbrains-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Attach .zip to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true

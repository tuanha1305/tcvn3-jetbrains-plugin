name: Build, test, release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach .zip to release on tag push
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: gradle test --no-daemon --stacktrace

      - name: Verify plugin
        run: gradle verifyPluginProjectConfiguration --no-daemon

      - name: Build plugin .zip
        run: gradle buildPlugin --no-daemon

      - name: Show artifact
        run: ls -la build/distributions/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcvn3-jetbrains-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Attach .zip to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
